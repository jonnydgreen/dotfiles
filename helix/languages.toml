[language-server.oxlint]
command = "oxlint"
args = ["--lsp"]


[language-server.tofu-ls]
command = "tofu-ls"
args = ["serve"]
# config.indexing.ignorePaths = ["ignore.hcl"]


[language-server.mpls]
command = "mpls"
config = { markdown.preview.auto = false }
args = ["--dark-mode", "--enable-emoji", "--no-auto"]


[[language]]
name = "hcl"
language-servers = ["tofu-ls"]
language-id = "terraform"
auto-format = true


[[language]]
name = "tfvars"
language-servers = ["tofu-ls"]
language-id = "terraform-vars"
auto-format = true


# Configured to run alongside marksman.
[[language]]
name = "markdown"
language-servers = ["marksman", "mpls", "oxlint"]
auto-format = true
formatter = { command = "oxfmt", args = ["--stdin-filepath=file.md"] }


[[language]]
name = "javascript"
file-types = ["js", "jsx", "mjs"]
language-servers = ["typescript-language-server", "oxlint"]
auto-format = true
formatter = { command = "oxfmt", args = ["--stdin-filepath=file.js"] }


[[language]]
name = "jsx"
language-servers = ["typescript-language-server", "oxlint"]
auto-format = true
formatter = { command = "oxfmt", args = ["--stdin-filepath=file.jsx"] }


[[language]]
name = "typescript"
file-types = ["ts", "tsx", "mts"]
language-servers = ["typescript-language-server", "oxlint"]
auto-format = true
formatter = { command = "oxfmt", args = ["--stdin-filepath=file.ts"] }


[[language]]
name = "tsx"
language-servers = ["typescript-language-server", "oxlint"]
auto-format = true
formatter = { command = "oxfmt", args = ["--stdin-filepath=file.tsx"] }


[[language]]
name = "toml"
auto-format = true
formatter = { command = "taplo", args = ["fmt", "-"] }


[[language]]
name = "nix"
auto-format = true
formatter = { command = "nixfmt" }


[[language]]
name = "javascript"
language-servers = [
  "typescript-language-server", # optional
  "oxlint",
]


[[language]]
name = "jsx"
language-servers = ["typescript-language-server", "oxlint"]


[[language]]
name = "typescript"
language-servers = ["typescript-language-server", "oxlint"]


[[language]]
name = "tsx"
language-servers = ["typescript-language-server", "oxlint"]
